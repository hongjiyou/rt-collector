name: 실거래 수집

on:
  schedule:
    # 한국시간 매월 15일과 1일 새벽 5시 전후에 결과가 준비되도록 (UTC 20:00 = KST 05:00 다음날)
    # 14일 → 15일 새벽, 28~31일 → 다음 날 새벽(마지막 실행이 1일 새벽)
    - cron: "0 20 14,28-31 * *"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "신고가 이력을 이 달부터 채움 (예: 202001). 처음 한 번만 넣고, 평소엔 비워 두세요."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install requests

      - name: 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: python collect.py

      - name: 결과 저장
        if: always()
        run: |
          git config user.name "rt-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out state || true
          if git diff --cached --quiet; then
            echo "바뀐 결과 없음"
          else
            git commit -m "실거래 수집 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi
